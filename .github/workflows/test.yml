name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install LLVM 18
        run: |
          sudo apt-get install -y llvm-18-dev llvm-18 clang-18 libclang-18-dev
          sudo ln -sf /usr/bin/llvm-lib-18 /usr/bin/llvm-lib
      - run: pixi run install-openvaf
      - run: pixi run build
      - run: pixi run test

  # TODO: remove once Windows support is validated
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install openvaf-r (pre-built)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://fides.fe.uni-lj.si/openvaf/download/openvaf-reloaded-20260616-2-gc592eed6-win_x64.zip" -OutFile openvaf.zip
          Expand-Archive openvaf.zip -DestinationPath "$env:USERPROFILE\.local\bin"
          echo "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: pixi run build

      - name: Verify openvaf-r and compile a test model
        shell: pwsh
        run: |
          openvaf-r --version
          openvaf-r --allow variant_const_simparam tests/devices/resistor_va.va -o test_resistor.osdi
          Get-ChildItem test_resistor.osdi

      - name: Diagnose .osdi exports
        shell: pwsh
        run: |
          @'
          import os, struct, sys
          path = os.path.abspath('test_resistor.osdi')
          print(f'Path: {path}  Size: {os.path.getsize(path)}')
          with open(path, 'rb') as f:
              f.seek(0x3C)
              pe_off = struct.unpack('<I', f.read(4))[0]
              f.seek(pe_off + 4)
              machine = struct.unpack('<H', f.read(2))[0]
              print(f'PE machine: 0x{machine:04X}')
              f.seek(pe_off + 6)
              num_sections = struct.unpack('<H', f.read(2))[0]
              f.seek(pe_off + 0x14)
              opt_size = struct.unpack('<H', f.read(2))[0]
              f.seek(pe_off + 0x18)
              opt_magic = struct.unpack('<H', f.read(2))[0]
              opt_hdr_size = 0x70 if opt_magic == 0x10b else 0x88
              dd_off = pe_off + 0x18 + opt_hdr_size
              f.seek(dd_off)
              export_rva, export_size = struct.unpack('<II', f.read(8))
              print(f'Export dir RVA=0x{export_rva:X} size={export_size}')
              if export_rva == 0:
                  print('NO EXPORT TABLE'); sys.exit(1)
              sec_start = pe_off + 0x18 + opt_size
              rva_to_file = None
              for i in range(num_sections):
                  f.seek(sec_start + i * 40 + 12)
                  vaddr, raw_size, raw_off = struct.unpack('<III', f.read(12))
                  if vaddr <= export_rva < vaddr + max(raw_size, 0x1000):
                      rva_to_file = lambda r, v=vaddr, o=raw_off: r - v + o
                      break
              if rva_to_file is None:
                  print('Cannot map export RVA'); sys.exit(1)
              edir = rva_to_file(export_rva)
              f.seek(edir + 24)
              num_names = struct.unpack('<I', f.read(4))[0]
              f.seek(edir + 32)
              names_rva = struct.unpack('<I', f.read(4))[0]
              print(f'Exported symbols ({num_names}):')
              for j in range(num_names):
                  f.seek(rva_to_file(names_rva) + j * 4)
                  name_rva = struct.unpack('<I', f.read(4))[0]
                  f.seek(rva_to_file(name_rva))
                  name = b''
                  while True:
                      c = f.read(1)
                      if c == b'\x00' or not c: break
                      name += c
                  print(f'  [{j}] {name}')
          '@ | Out-File -Encoding utf8 _diag.py
          pixi run python _diag.py

      - run: pixi run test
