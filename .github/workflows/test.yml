name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install LLVM 18
        run: |
          sudo apt-get install -y llvm-18-dev llvm-18 clang-18 libclang-18-dev
          sudo ln -sf /usr/bin/llvm-lib-18 /usr/bin/llvm-lib
      - run: pixi run install-openvaf
      - run: pixi run build
      - run: pixi run test

  # TODO: remove once Windows support is validated
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install openvaf-r (pre-built)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://fides.fe.uni-lj.si/openvaf/download/openvaf-reloaded-20260616-2-gc592eed6-win_x64.zip" -OutFile openvaf.zip
          Expand-Archive openvaf.zip -DestinationPath "$env:USERPROFILE\.local\bin"
          echo "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: pixi run build

      - name: Verify openvaf-r and compile a test model
        shell: pwsh
        run: |
          openvaf-r --version
          openvaf-r --allow variant_const_simparam tests/devices/resistor_va.va -o test_resistor.osdi
          Get-ChildItem test_resistor.osdi

      - name: Diagnose .osdi loading
        shell: pwsh
        run: |
          pixi run python -c "
          import ctypes, ctypes.wintypes, os, struct
          path = os.path.abspath('test_resistor.osdi')
          print(f'Loading: {path}')
          print(f'Exists: {os.path.exists(path)}')
          print(f'Size: {os.path.getsize(path)}')
          # Check PE architecture
          with open(path, 'rb') as f:
              f.seek(0x3C)
              pe_off = struct.unpack('<I', f.read(4))[0]
              f.seek(pe_off + 4)
              machine = struct.unpack('<H', f.read(2))[0]
              print(f'PE machine: 0x{machine:04X} (0x8664=AMD64, 0x14C=i386)')
          import platform
          print(f'Python arch: {platform.machine()}')
          # Try loading
          try:
              dll = ctypes.CDLL(path)
              print(f'CDLL SUCCESS: {dll}')
          except OSError as e:
              print(f'CDLL FAILED: {e}')
          try:
              dll = ctypes.WinDLL(path)
              print(f'WinDLL SUCCESS: {dll}')
          except OSError as e:
              print(f'WinDLL FAILED: {e}')
          # Also try loading via bosdi
          try:
              import osdi_shim_nb
              meta = osdi_shim_nb.load_osdi_library(path, 4)
              print(f'bosdi load success={meta.success}')
              if not meta.success:
                  print(f'bosdi error: {osdi_shim_nb.get_last_error()}')
          except Exception as e:
              print(f'bosdi import/load error: {e}')
          "

      - run: pixi run test
