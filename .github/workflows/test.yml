name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install LLVM 18
        run: |
          sudo apt-get install -y llvm-18-dev llvm-18 clang-18 libclang-18-dev
          sudo ln -sf /usr/bin/llvm-lib-18 /usr/bin/llvm-lib
      - run: pixi run install-openvaf
      - run: pixi run build
      - run: pixi run test

  # TODO: remove once Windows support is validated
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install openvaf-r (pre-built)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://fides.fe.uni-lj.si/openvaf/download/openvaf-reloaded-20260616-2-gc592eed6-win_x64.zip" -OutFile openvaf.zip
          Expand-Archive openvaf.zip -DestinationPath "$env:USERPROFILE\.local\bin"
          echo "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: pixi run build

      - name: Verify openvaf-r and compile a test model
        shell: pwsh
        run: |
          openvaf-r --version
          openvaf-r --allow variant_const_simparam tests/devices/resistor_va.va -o test_resistor.osdi
          Get-ChildItem test_resistor.osdi

      - name: Diagnose .osdi loading
        shell: pwsh
        run: |
          pixi run python -c "
          import ctypes, ctypes.wintypes, os, struct
          path = os.path.abspath('test_resistor.osdi')
          print(f'Loading: {path}')
          print(f'Size: {os.path.getsize(path)}')
          # Parse PE export table to see actual symbol names
          with open(path, 'rb') as f:
              f.seek(0x3C)
              pe_off = struct.unpack('<I', f.read(4))[0]
              f.seek(pe_off + 4)
              machine = struct.unpack('<H', f.read(2))[0]
              print(f'PE machine: 0x{machine:04X}')
              f.seek(pe_off + 6)
              num_sections = struct.unpack('<H', f.read(2))[0]
              f.seek(pe_off + 0x18)
              opt_magic = struct.unpack('<H', f.read(2))[0]
              opt_hdr_size = 0x70 if opt_magic == 0x10b else 0x88  # PE32 vs PE32+
              export_rva = struct.unpack('<I', f.read(4))[0] if False else 0
              # Read export directory RVA from data directory[0]
              dd_off = pe_off + 0x18 + opt_hdr_size
              f.seek(dd_off)
              export_rva, export_size = struct.unpack('<II', f.read(8))
              print(f'Export dir RVA: 0x{export_rva:X}, size: {export_size}')
              if export_rva == 0:
                  print('NO EXPORT TABLE')
              else:
                  # Find section containing export RVA
                  sec_off = pe_off + 0x18 + (0x60 if opt_magic == 0x10b else 0x70) + 0x10 * 16
                  # Actually, section headers start after optional header
                  f.seek(pe_off + 0x14)
                  opt_size = struct.unpack('<H', f.read(2))[0]
                  sec_start = pe_off + 0x18 + opt_size
                  file_off = None
                  for i in range(num_sections):
                      f.seek(sec_start + i * 40 + 12)
                      vaddr, vsize_raw, raw_off = struct.unpack('<III', f.read(12))
                      if vaddr <= export_rva < vaddr + max(vsize_raw, 1):
                          file_off = export_rva - vaddr + raw_off
                          break
                  if file_off is None:
                      print('Could not map export RVA to file offset')
                  else:
                      f.seek(file_off + 24)
                      num_names = struct.unpack('<I', f.read(4))[0]
                      f.seek(file_off + 32)
                      names_rva = struct.unpack('<I', f.read(4))[0]
                      names_file = names_rva - export_rva + file_off
                      print(f'Exported symbols ({num_names}):')
                      for j in range(num_names):
                          f.seek(names_file + j * 4)
                          name_rva = struct.unpack('<I', f.read(4))[0]
                          name_file = name_rva - export_rva + file_off
                          f.seek(name_file)
                          name = b''
                          while True:
                              c = f.read(1)
                              if c == b'\x00' or not c: break
                              name += c
                          print(f'  [{j}] {name.decode(\"ascii\", errors=\"replace\")}')
          "

      - run: pixi run test
