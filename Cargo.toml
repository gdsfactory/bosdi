[package]
name = "bosdi"
version = "0.1.3"  # Internal static library; Python distribution version comes from Git tags.
edition = "2021"
description = "Rust core for BOSDI: batched OSDI device model evaluation via libloading + Rayon"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
name = "bosdi"

[dependencies]
lazy_static = "1.4"
libloading = "0.8"
rayon = "1.8"
